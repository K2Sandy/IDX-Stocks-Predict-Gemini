<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediksi Sektor Saham Harian</title>
<style>
  :root {
    --bg: #f6f8fa; --card: #ffffff; --border: #d0d7de; --text: #1f2328; --muted: #656d76;
    --naik-border: #1a7f37; --naik-bg: #eafbf0; --naik-text: #1a7f37;
    --turun-border: #cf222e; --turun-bg: #fdeeee; --turun-text: #cf222e;
    --netral-border: #6e7781; --netral-bg: #f3f4f6; --netral-text: #6e7781;
    --none-border: #d0d7de; --none-bg: #f6f8fa; --none-text: #656d76;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 24px 16px 60px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; }
  .link-artikel { font-size: 13px; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .link-artikel:hover { text-decoration: underline; }
  .updated { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .updated .titik { margin: 0 6px; opacity: .5; }

  /* -- tombol tanggal (riwayat), klik buat lihat hari-hari sebelumnya -- */
  .tanggal-scroll { overflow-x: auto; padding-bottom: 4px; margin-bottom: 20px; }
  .tanggal-row { display: flex; gap: 8px; width: max-content; }
  .btn-tanggal {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 13px; font-weight: 600;
    cursor: pointer; white-space: nowrap; transition: background .1s, color .1s;
  }
  .btn-tanggal:hover { background: #eef1f4; }
  .btn-tanggal.aktif { background: var(--text); color: #fff; border-color: var(--text); }

  .highlight { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 24px; }
  .highlight h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--bg); }
  .chip small { font-weight: 400; margin-left: 6px; opacity: .75; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-left-width: 5px; border-radius: 10px; padding: 16px; }
  .card h3 { margin: 0 0 8px; font-size: 16px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 10px; }
  .card p { margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: #33383e; }
  .card p b { color: var(--text); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Prediksi Sektor Saham Harian</h1>
    <a class="link-artikel" href="artikel.html">Lihat semua artikel &rarr;</a>
  </header>
  <div class="updated" id="info-update">Memuat...</div>

  <div class="tanggal-scroll">
    <div class="tanggal-row" id="daftar-tombol-tanggal"></div>
  </div>

  <div class="highlight">
    <h2>Saham spesifik yang disebut</h2>
    <div class="chip-row" id="daftar-saham"><span class="empty">Memuat...</span></div>
  </div>

  <div class="grid" id="grid-sektor"></div>
</div>

<script>
// --------------------------------------------------------------------
// Rating 1-7: 1 = pasti turun, 4 = netral, 7 = pasti naik. Warna dihitung
// dengan interpolasi antara tiga warna dasar (bukan tabel warna per
// sektor "NAIK/TURUN/NETRAL" seperti sebelumnya), supaya tiap angka di
// antaranya juga dapat warna yang masuk akal.
// --------------------------------------------------------------------
const LABEL_RATING = {
  1: "Pasti Turun", 2: "Turun", 3: "Cenderung Turun", 4: "Netral",
  5: "Cenderung Naik", 6: "Naik", 7: "Pasti Naik",
};
const WARNA_DASAR = {
  turun:  { border: "#cf222e", bg: "#fdeeee", text: "#cf222e" },
  netral: { border: "#6e7781", bg: "#f3f4f6", text: "#6e7781" },
  naik:   { border: "#1a7f37", bg: "#eafbf0", text: "#1a7f37" },
};
function hexKeRgb(hex) {
  hex = hex.replace("#", "");
  return [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
}
function interpolasi(hexA, hexB, t) {
  const a = hexKeRgb(hexA), b = hexKeRgb(hexB);
  const c = a.map((v, i) => Math.round(v + (b[i] - v) * t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function warnaUntukRating(rating) {
  if (!rating) return { border: "var(--none-border)", bg: "var(--none-bg)", text: "var(--none-text)" };
  const [dari, ke, t] = rating <= 4
    ? [WARNA_DASAR.turun, WARNA_DASAR.netral, (rating - 1) / 3]
    : [WARNA_DASAR.netral, WARNA_DASAR.naik, (rating - 4) / 3];
  return {
    border: interpolasi(dari.border, ke.border, t),
    bg: interpolasi(dari.bg, ke.bg, t),
    text: interpolasi(dari.text, ke.text, t),
  };
}

async function ambilJSON(path) {
  const res = await fetch(path + "?v=" + Date.now()); // hindari cache basi di browser
  if (!res.ok) throw new Error("Gagal memuat " + path);
  return res.json();
}

function render(data) {
  const jumlah = data.jumlah_artikel != null ? data.jumlah_artikel : (data.artikel || []).length;
  document.getElementById("info-update").innerHTML =
    "Tanggal " + data.tanggal +
    '<span class="titik">&middot;</span>' + jumlah + " artikel dianalisis" +
    (data.dibuat_pada ? '<span class="titik">&middot;</span>dibuat ' + data.dibuat_pada : "");

  const daftarSaham = document.getElementById("daftar-saham");
  const kodeSaham = Object.keys(data.saham_disebut || {});
  daftarSaham.innerHTML = "";
  if (kodeSaham.length === 0) {
    daftarSaham.innerHTML = '<span class="empty">Tidak ada saham spesifik disebut hari ini.</span>';
  } else {
    kodeSaham.forEach(kode => {
      const konteks = (data.saham_disebut[kode] || []).join(", ");
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.innerHTML = kode + "<small>" + konteks + "</small>";
      daftarSaham.appendChild(chip);
    });
  }

  const grid = document.getElementById("grid-sektor");
  grid.innerHTML = "";
  const daftarSektor = data.sektor || [];
  if (daftarSektor.length === 0) {
    grid.innerHTML = '<p class="empty">Belum ada data sektor untuk tanggal ini.</p>';
    return;
  }
  daftarSektor.forEach(s => {
    const warna = warnaUntukRating(s.prediksi);
    const card = document.createElement("div");
    card.className = "card";
    card.style.borderLeftColor = warna.border;

    const labelBadge = s.prediksi
      ? s.prediksi + "/7 &middot; " + (LABEL_RATING[s.prediksi] || "")
      : "TIDAK ADA DATA";

    let isi = "<h3>" + s.nama + "</h3>";
    isi += '<span class="badge" style="background:' + warna.bg + ";color:" + warna.text + '">' +
           labelBadge + "</span>";
    if (s.status === "ok") {
      if (s.key_sentiment) isi += "<p><b>Sentimen:</b> " + s.key_sentiment + "</p>";
      if (s.alasan) isi += "<p><b>Alasan:</b> " + s.alasan + "</p>";
      if (s.analisis_saham) isi += "<p><b>Saham:</b> " + s.analisis_saham + "</p>";
    } else if (s.status === "error") {
      isi += "<p>Gagal dianalisis hari ini.</p>";
    } else {
      isi += "<p>Tidak ada berita untuk sektor ini hari ini.</p>";
    }
    card.innerHTML = isi;
    grid.appendChild(card);
  });
}

async function muatTanggal(tanggal) {
  document.querySelectorAll(".btn-tanggal").forEach(btn => {
    btn.classList.toggle("aktif", btn.dataset.tanggal === tanggal);
  });
  try {
    const data = await ambilJSON("data/" + tanggal + ".json");
    render(data);
  } catch (e) {
    document.getElementById("grid-sektor").innerHTML = '<p class="empty">Gagal memuat data tanggal ' + tanggal + ".</p>";
  }
}

async function mulai() {
  try {
    const manifest = await ambilJSON("data/manifest.json");
    const daftarTanggal = manifest.tanggal_tersedia || [];
    const wadahTombol = document.getElementById("daftar-tombol-tanggal");

    if (daftarTanggal.length === 0) {
      document.getElementById("info-update").textContent = "Belum ada data.";
      return;
    }

    daftarTanggal.forEach(t => {
      const btn = document.createElement("button");
      btn.className = "btn-tanggal";
      btn.textContent = t;
      btn.dataset.tanggal = t;
      btn.addEventListener("click", () => muatTanggal(t));
      wadahTombol.appendChild(btn);
    });

    await muatTanggal(daftarTanggal[0]); // default: tanggal terbaru
  } catch (e) {
    document.getElementById("info-update").textContent = "Belum ada data (manifest.json tidak ditemukan).";
  }
}
mulai();
</script>
</body>
</html>
